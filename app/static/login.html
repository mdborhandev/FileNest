<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — FileNest</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav class="nav">
        <a class="brand" href="/">FileNest</a>
        <div class="nav-links">
            <a class="btn btn-ghost" href="/docs">API Docs</a>
        </div>
    </nav>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h1>Welcome back</h1>
            <p class="sub">Log in to your FileNest account.</p>

            <div class="alert alert-error" data-alert style="display:none;"></div>

            <form id="auth-form" data-mode="login" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                    <span class="field-msg">Enter a valid email address.</span>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <span class="field-msg">Password must be at least 8 characters.</span>
                </div>
                <button class="btn btn-primary btn-block" type="submit" data-label="Log in" data-busy="Logging in…">Log in</button>
            </form>

            <p class="auth-footer">Don't have an account? <a href="/register">Sign up</a></p>
        </div>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth-forms.js"></script>
</body>
</html>
